# Пайплайн данных: ingest → validate_raw → prepare → validate_prepared → features.
# `dvc repro` перезапускает только стадии, у которых изменились deps или params
# (сравнение с хешами в dvc.lock). `dvc dag` рисует граф.
#
# Месяцы берутся из того же configs/base.yaml, что читает приложение: один источник правды.
# Пути outs совпадают с paths.data_root = data (storage.py); при другом корне их надо поменять.
vars:
  - configs/base.yaml:data

stages:
  # Одна стадия на месяц (ingest@2024-01, ...): каждый месяц хешируется и кешируется отдельно,
  # добавление месяца не трогает уже скачанные.
  ingest:
    foreach: ${data.months}
    do:
      cmd: uv run --frozen taxi ingest --month ${item}
      # Кода в deps нет намеренно: содержимое файла определяет источник (URL), а не наш код.
      # Иначе рефакторинг ingest.py заново скачивал бы все месяцы.
      params:
        - configs/base.yaml:
            - data.url_template
      outs:
        - data/raw/green_tripdata_${item}.parquet

  # Quality gate сырых данных (этап 03). Провал critical-ожидания → код 1 → dvc repro
  # останавливается, и стадии ниже по графу (prepare, features) не выполняются.
  validate_raw:
    foreach: ${data.months}
    do:
      cmd: uv run --frozen taxi validate --month ${item} --stage raw
      deps:
        - data/raw/green_tripdata_${item}.parquet
        # Контракт и runner: изменили ожидания → данные перепроверяются.
        - src/taxi_duration/validation
      # metrics, а не outs: маленький JSON хранится в git (cache: false), его читают
      # `dvc metrics show` / `dvc metrics diff` — динамика качества данных по коммитам.
      metrics:
        - reports/validation/raw_${item}.json:
            cache: false

  prepare:
    foreach: ${data.months}
    do:
      cmd: uv run --frozen taxi prepare --month ${item}
      deps:
        - data/raw/green_tripdata_${item}.parquet
        # Порядок стадий в DVC задаёт только граф deps → outs. Зависимость от отчёта
        # validate_raw ставит prepare строго после проверки (и не даёт запустить его без неё).
        - reports/validation/raw_${item}.json
        - src/taxi_duration/data/prepare.py
      # Порог длительности поменялся → prepare (и всё после него) пересчитывается.
      params:
        - configs/base.yaml:
            - data.filters
      outs:
        - data/processed/trips_${item}.parquet

  # Quality gate подготовленных данных: контракт PREPARED_SCHEMA перед построением признаков.
  validate_prepared:
    foreach: ${data.months}
    do:
      cmd: uv run --frozen taxi validate --month ${item} --stage prepared
      deps:
        - data/processed/trips_${item}.parquet
        - src/taxi_duration/validation
      metrics:
        - reports/validation/prepared_${item}.json:
            cache: false

  features:
    cmd: uv run --frozen taxi build-features
    deps:
      - data/processed
      # Каталог целиком: features ждёт validate_prepared всех месяцев из data.months.
      - reports/validation
      - src/taxi_duration/features/zone_stats.py
    params:
      - configs/base.yaml:
        - data.months
        - features.window_days
    outs:
      - data/features/zone_stats.parquet
