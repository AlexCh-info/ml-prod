# Шаблон для logging.config.dictConfig.
# setup_logging() подставляет formatter (text|json) и уровень из настроек,
# поэтому значения handlers.console.formatter и loggers.taxi_duration.level здесь — дефолты.
version: 1
# Не отключать логгеры, созданные при импорте модулей до вызова dictConfig
# (logger = logging.getLogger(__name__) на уровне модуля) — иначе они замолчат.
disable_existing_loggers: false

formatters:
  text:
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  json:
    # "()" — фабрика: остальные ключи уходят в конструктор как kwargs.
    (): pythonjsonlogger.json.JsonFormatter
    fmt: "%(levelname)s %(name)s %(message)s"
    timestamp: true          # ключ "timestamp", ISO-8601 в UTC
    rename_fields:
      levelname: level
      name: logger

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout   # 12-factor: логи в stdout, собирает среда (Docker, K8s)
    formatter: text

loggers:
  # Наш код. Уровень задаётся settings.logging.level.
  taxi_duration:
    level: INFO

root:
  # Чужие библиотеки (urllib3, botocore...) — только предупреждения и выше.
  level: WARNING
  handlers: [console]
