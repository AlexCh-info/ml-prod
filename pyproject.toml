[project]
name = "taxi-duration"
version = "0.0.0"
description = "Учебный end-to-end MLOps-проект: прогноз длительности поездки NYC Green Taxi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "great-expectations>=1.25.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "s3fs>=2026.9.0",
    "typer>=0.29.1",
]

[project.scripts]
taxi = "taxi_duration.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_duration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: неиспользуемые импорты/переменные, неопределённые имена
    "I",        # isort: порядок импортов
    "UP",       # pyupgrade: современный синтаксис 3.12
    "B",        # bugbear: частые баги (мутабельные дефолты и т.п.)
    "SIM",      # упрощения
    "RUF",      # правила самого ruff
]
ignore = [
    # «Похожие» символы: защита от гомоглифов в латинском коде. У нас комментарии
    # и docstring на русском — каждая «с», «а», «о» давала бы ложное срабатывание.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["taxi_duration"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["taxi_duration", "tests"]
plugins = ["pydantic.mypy"]

# У этих библиотек нет аннотаций типов (py.typed) и stub-пакетов на PyPI.
[[tool.mypy.overrides]]
module = ["fsspec.*", "pyarrow.*", "s3fs.*"]
ignore_missing_imports = true

# GX реэкспортирует публичный API (gxe.ExpectColumnToExist, gx.ExpectationSuite...) без __all__,
# а strict включает no_implicit_reexport. Разрешаем неявный реэкспорт только для GX.
[[tool.mypy.overrides]]
module = ["great_expectations.*"]
implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
